<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Artigos Esportivos</title>
    <style>
        /* SEU CSS (igual ao anterior) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
             background: url('https://www.esportealternativo.com.br/images/stories/ea/saude/netsheasede.jpg') no-repeat center center fixed;
             background-size: cover;
             padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.4em;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px #0002;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0077cc;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .product-item {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #f2f2f2;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .product-photo {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Artigos Esportivos</h1>
        <p>Gerenciador de Produtos</p>
    </header>

    <div class="content">
        
        <div class="card">
            <h2>Adicionar Produto</h2>

            <input id="nome" placeholder="Nome do produto">
            <input id="preco" type="number" step="0.01" placeholder="Preço">
            <input id="foto" placeholder="URL da imagem">

            <button onclick="addProduto()">Cadastrar</button>
        </div>

        <div class="card">
            <h2>Produtos Cadastrados</h2>
            <ul id="lista"></ul>
        </div>

    </div>
</div>

<script>
const API = "http://localhost:3001/api/produtos";

document.addEventListener("DOMContentLoaded", carregar);

async function carregar() {
    const res = await fetch(API);
    const dados = await res.json();

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    dados.forEach(p => {
        lista.innerHTML += `
            <li class="product-item">
                <img class="product-photo" 
                     src="${p.foto}" 
                     onerror="this.onerror=null;this.src='https://via.placeholder.com/80';">
                <div>
                    <b>${p.nome}</b><br>
                    R$ ${p.preco}
                </div>
                <button onclick="delProduto(${p.id})" style="margin-left:auto;background:red;">Excluir</button>
            </li>
        `;
    });
}

async function addProduto() {
    const nome = document.getElementById("nome").value;
    const preco = document.getElementById("preco").value;
    const foto = document.getElementById("foto").value;

    await fetch(API, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ nome, preco, foto })
    });

    carregar();
}

async function delProduto(id) {
    await fetch(`${API}/${id}`, { method: "DELETE" });
    carregar();
}
</script>

</body>
</html>
